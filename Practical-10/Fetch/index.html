
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Online Food Order Dashboard</title>

    <!-- jQuery CDN -->
    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>

    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 30px;
            background-color: #f4f4f4;
        }

        h2 {
            color: #333;
        }

        button {
            padding: 10px 20px;
            background-color: #e67e22;
            color: white;
            border: none;
            cursor: pointer;
            font-size: 16px;
            border-radius: 5px;
        }

        button:hover {
            background-color: #ca6f1e;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 20px;
            background-color: white;
        }

        th, td {
            border: 1px solid #ccc;
            padding: 12px;
            text-align: center;
        }

        th {
            background-color: #333;
            color: white;
        }

        .Preparing {
            color: #d97706;
            font-weight: bold;
        }

        .Ready {
            color: #2563eb;
            font-weight: bold;
        }

        .Delivered {
            color: #15803d;
            font-weight: bold;
        }

        .summary {
            margin-top: 20px;
            padding: 15px;
            background-color: white;
            border-left: 5px solid #e67e22;
            border-radius: 5px;
        }

        #message {
            margin-top: 15px;
            font-weight: bold;
        }
    </style>
</head>

<body>

    <h2>Online Food Order Dashboard</h2>

    <button id="loadBtn">View Orders</button>

    <p id="message">Click View Orders to load all orders.</p>

    <table>
        <thead>
            <tr>
                <th>Order ID</th>
                <th>Customer Name</th>
                <th>Food Item</th>
                <th>Quantity</th>
                <th>Total Amount (₹)</th>
                <th>Order Status</th>
            </tr>
        </thead>

        <tbody id="tablebody">
            <tr>
                <td colspan="6">No orders loaded yet.</td>
            </tr>
        </tbody>
    </table>

    <div class="summary">
        <h3>Total Number of Orders: <span id="totalOrders">0</span></h3>
        <h3>Total Sales Amount: ₹<span id="totalSales">0.00</span></h3>
    </div>

    <script>
        // Load orders when the button is clicked
        $("#loadBtn").click(function () {

            $("#message").text("Loading orders...");

            $.getJSON("orders.json", function (data) {

                // Clear old rows to prevent duplicates
                $("#tablebody").empty();

                let totalSales = 0;
                let totalOrders = 0;

                // Process every JSON record
                $.each(data, function (index, order) {

                    totalOrders++;

                    totalSales += Number(order.totalAmount);

                    // Create and insert a table row
                    $("#tablebody").append(`
                        <tr>
                            <td>${order.orderId}</td>
                            <td>${order.customerName}</td>
                            <td>${order.foodItem}</td>
                            <td>${order.quantity}</td>
                            <td>${Number(order.totalAmount).toFixed(2)}</td>
                            <td class="${order.status}">
                                ${order.status}
                            </td>
                        </tr>
                    `);

                });

                // Display summary below the table
                $("#totalOrders").text(totalOrders);
                $("#totalSales").text(totalSales.toFixed(2));

                $("#message").text("Orders loaded successfully!");

            }).fail(function () {

                // Display an error if JSON cannot be loaded
                $("#tablebody").html(`
                    <tr>
                        <td colspan="6">
                            Unable to load orders. Please check orders.json.
                        </td>
                    </tr>
                `);

                $("#totalOrders").text("0");
                $("#totalSales").text("0.00");

                $("#message").text("Error: JSON data could not be loaded.");

            });

        });
    </script>

</body>
</html>
